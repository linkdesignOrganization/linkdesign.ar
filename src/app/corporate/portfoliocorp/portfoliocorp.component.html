<ngx-json-ld [json]="portfolioSchema"></ngx-json-ld>
<section class="portfolio-section pb-5">
  <p class="title-inside dark-blue hk-bold text-center mb-3 portfolio-title">
    {{ 'CORPORATE.PORTFOLIO.TITLE_LINE1' | translate }} <br>{{ 'CORPORATE.PORTFOLIO.TITLE_LINE2' | translate }}
  </p>

  <div class="portfolio-carousel-shell">
    <div class="splide portfolio-splide" #portfolioSlider
      [attr.aria-label]="'CORPORATE.PORTFOLIO.ARIA.SECTION' | translate">
      <div class="splide__arrows portfolio-controls"
        [attr.aria-label]="'CORPORATE.PORTFOLIO.ARIA.SECTION' | translate">
        <button class="splide__arrow splide__arrow--prev portfolio-arrow" type="button"
          [attr.aria-label]="'CORPORATE.PORTFOLIO.ARIA.PREV' | translate">
          <i class="bi bi-arrow-left" aria-hidden="true"></i>
        </button>

        <button class="splide__arrow splide__arrow--next portfolio-arrow" type="button"
          [attr.aria-label]="'CORPORATE.PORTFOLIO.ARIA.NEXT' | translate">
          <i class="bi bi-arrow-right" aria-hidden="true"></i>
        </button>
      </div>

      <div class="splide__track">
        <ul class="splide__list">
          <li class="splide__slide" *ngFor="let Project of projects">
            <article class="card light-blue-bg border-0 rounded-5 p-4 portfolio-card">
              <a class="card-media-link" [href]="Project.link" target="_blank" rel="noopener">
                <picture>
                  <source *ngIf="Project.cover.webp" [srcset]="Project.cover.webp.srcset || Project.cover.webp.src"
                    [attr.sizes]="Project.cover.webp.sizes || null" [type]="Project.cover.webp.type">
                  <img [attr.alt]="'CORPORATE.PORTFOLIO.CARD_IMAGE_ALT' | translate: { name: Project.name }"
                    [src]="Project.cover.fallback.src" [attr.srcset]="Project.cover.fallback.srcset || null"
                    [attr.sizes]="Project.cover.fallback.sizes || null" loading="lazy" decoding="async"
                    width="1500" height="938" class="card-img-top rounded-4 portfolio-cover">
                </picture>
              </a>

              <div class="card-body px-0 portfolio-card-body">
                <div class="portfolio-card-header">
                  <img [src]="Project.logo.fallback.src"
                    [attr.alt]="'CORPORATE.PORTFOLIO.LOGO_ALT' | translate: { name: Project.name }" loading="lazy"
                    decoding="async" width="300" height="140" class="portfolio-logo">
                  <span class="badge rounded-pill badge-industry">{{ Project.industry }}</span>
                </div>

                <p class="text hk-regular gray mb-0 portfolio-card-text">{{ Project.descriptionKey | translate }}</p>

                <div class="portfolio-card-actions">
                  <a class="portfolio-action-btn portfolio-action-btn--primary hk-semibold" [href]="Project.link"
                    target="_blank" rel="noopener">
                    <i class="bi bi-box-arrow-up-right" aria-hidden="true"></i>
                    <span>{{ 'CORPORATE.PORTFOLIO.VISIT_SITE' | translate }}</span>
                  </a>
                </div>
              </div>
            </article>
          </li>
        </ul>
      </div>
    </div>
  </div>
</section>
