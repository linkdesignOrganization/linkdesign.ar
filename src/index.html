  <script>
    (function () {
      var body = document.body;
      var panels = document.querySelectorAll('.panel');
      if (!panels.length) {
        return;
      }

      function updateBodyColor() {
        var scroll = window.scrollY + (window.innerHeight / 3);

        for (var i = 0; i < panels.length; i += 1) {
          var panel = panels[i];
          var rect = panel.getBoundingClientRect();
          var panelTop = rect.top + window.scrollY;
          var panelBottom = panelTop + rect.height;
          if (panelTop <= scroll && panelBottom > scroll) {
            var classesToRemove = body.className.match(/(^|\s)color-\S+/g) || [];
            if (classesToRemove.length) {
              body.classList.remove.apply(body.classList, classesToRemove.map(function (entry) {
                return entry.trim();
              }));
            }
            var color = panel.getAttribute('data-color');
            if (color) {
              body.classList.add('color-' + color);
            }
          }
        }
      }

      window.addEventListener('scroll', updateBodyColor, { passive: true });
      window.addEventListener('resize', updateBodyColor);
      updateBodyColor();
    })();
  </script>
